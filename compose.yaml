services:
  voiceguard:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VG_MAX_BYTES: "15728640"
      VG_MAX_SECONDS: "120"
      VG_RATE_LIMIT: "6"
    volumes:
      - model-cache:/home/voiceguard/.cache/huggingface
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
volumes:
  model-cache:
